name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset=prod -G Ninja

      - name: Build
        run: cmake --build --preset=prod

      - name: Rename artifact
        run: cp build/bin/qianjs.exe qianjs-${{ github.ref_name }}-windows-x86_64.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: qianjs-${{ github.ref_name }}-windows-x86_64.exe
          generate_release_notes: true
