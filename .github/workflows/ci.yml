# Linux 上构建并运行 qianjs_tests（GoogleTest / ctest）。

name: Linux unit tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # OpenGL (NanoVG) + X11 headers/libs (SDL2 video on Linux)
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libgl1-mesa-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxrandr-dev libxrender-dev libxss-dev

      - name: Configure
        run: cmake --preset=dev

      - name: Build
        run: cmake --build --preset=dev -j "$(nproc)"

      - name: Unit tests (ctest)
        run: ctest --preset=dev --output-on-failure

      - name: Canvas module smoke (headless)
        env:
          QIANJS_NULL_UI: "1"
        run: ./build/bin/qianjs run examples/breakout.js 128
